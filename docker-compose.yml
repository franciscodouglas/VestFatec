version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: vestfatec-postgres
    environment:
      POSTGRES_DB: vestfatec
      POSTGRES_USER: vestfatec
      POSTGRES_PASSWORD: vestfatec
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: vestfatec-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
